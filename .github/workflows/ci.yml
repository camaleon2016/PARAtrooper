name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      # Actions are pinned to full commit SHAs. Dependabot keeps the pins current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Syntax gate (flake8)
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Lint (pylint)
        run: pylint --fail-on=E,F --fail-under=9 $(git ls-files '*.py')

      - name: Tests
        run: pytest -q

      - name: Validate example assessment
        run: python skills/para/scripts/validate.py examples/support_agent.assessment.json --strict

      - name: Check eval cases and expected files
        run: python evals/check_cases.py

      - name: Check the prompt pack is current
        run: python tools/build_prompt_pack.py --check
