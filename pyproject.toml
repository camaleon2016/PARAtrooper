[project]
name = "para"
version = "0.3.0"
description = "Preemptive Agent Risk Assessment: inherent, residual, and forecast risk for AI agent designs."
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "jsonschema>=4.18",
    "rfc3339-validator>=0.1.4",
]

[dependency-groups]
dev = ["pytest>=8", "pylint>=4.0.9", "flake8>=7", "anthropic>=1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts", "evals"]

[tool.pylint.main]
py-version = "3.10"
init-hook = "import sys; sys.path[:0] = ['scripts', 'evals']"

[tool.pylint.format]
max-line-length = 127

[tool.pylint."messages control"]
disable = [
    "missing-module-docstring",
    "missing-function-docstring",
    "too-many-locals",
    "too-many-branches",
    "too-many-statements",
    "too-many-return-statements",
    "wrong-import-position",
]
