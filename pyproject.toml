[project]
name = "para"
version = "0.1.0"
description = "Preemptive Agent Risk Assessment: inherent, residual, and forecast risk for AI agent designs."
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "jsonschema>=4.18",
    "rfc3339-validator>=0.1.4",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts", "evals"]
